name: Coleta de precos

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      test_email:
        description: "E-mail para teste de SMTP (opcional; envia antes da coleta)"
        required: false
        type: string

concurrency:
  group: coleta-precos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DJANGO_DEBUG: "0"
      SITE_URL: ${{ vars.SITE_URL }}
      EMAIL_HOST: ${{ vars.EMAIL_HOST }}
      EMAIL_PORT: ${{ vars.EMAIL_PORT }}
      EMAIL_HOST_USER: ${{ vars.EMAIL_HOST_USER }}
      EMAIL_HOST_PASSWORD: ${{ secrets.EMAIL_HOST_PASSWORD }}
      EMAIL_USE_TLS: ${{ vars.EMAIL_USE_TLS || '1' }}
      DEFAULT_FROM_EMAIL: ${{ vars.DEFAULT_FROM_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Conferir secret DATABASE_URL
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "ERRO: defina o secret DATABASE_URL nas configuracoes do repositorio."
            exit 1
          fi

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Aplicar migracoes
        run: python manage.py migrate --noinput

      - name: Teste de SMTP (opcional)
        if: ${{ inputs.test_email != '' }}
        run: python manage.py sendtestemail ${{ inputs.test_email }}

      - name: Coletar catalogo e precos (lojas configuradas)
        run: |
          stores="${{ vars.SCRAPER_STORES || 'kabum,pichau,terabyte' }}"
          echo "Lojas: $stores"
          python manage.py import_catalog --stores "$stores"

      - name: Verificar alertas de preco
        run: python manage.py check_alerts

      - name: Verificar promocoes
        run: python manage.py check_promotions
