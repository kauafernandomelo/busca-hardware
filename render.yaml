services:
  - type: web
    name: busca-hardware
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 2
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: busca-hardware-db
          property: connectionString

databases:
  - name: busca-hardware-db
    databaseName: buscahardware
    plan: free
